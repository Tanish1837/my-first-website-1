<html>

<head>
    <title>My Mini Website</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
        }

        h1, h2 {
            font-family: Georgia, serif;
        }

        header {
            background-color: black;
            color: white;
            padding: 25px;
        }

        .card {
            background-color: white;
            width: 80%;
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        img {
            width: 200px;
            border-radius: 50%;
            border: 4px solid black;
        }

        h2 {
            color: blue;
        }

        p {
            font-size: 18px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
        }

        button:hover {
            background-color: darkblue;
        }

        input {
            padding: 10px;
            font-size: 16px;
        }

        #message,
        #contactMessage {
            color: green;
            font-weight: bold;
        }

        footer {
            background-color: black;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }

    </style>
</head>


<body>

    <header id ="home">
        <h1>Welcome to My Website 🚀</h1>
        <p>Hello bro! 👋</p>
      <nav>
        <a herf="#home">Home</a>
        <a herf="#about">About</a>
        <a herf="#contact">Contact</a>
      </nav>
    </header>


    <div class="card" id="about">

        <img src="myphoto.jpg" alt="My Photo">

        <h2>About Me 👨‍💻</h2>

        <p>
            Welcome to my first proper website!
            I am learning HTML, CSS and JavaScript.
        </p>

        <button onclick="showMessage()">Click Here</button>

        <p id="message"></p>

    </div>


    <div class="card" id ="contact">

        <h2>Contact Me 📩</h2>

        <p>Want to say hello? 👋</p>

        <input type="text" id="name" placeholder="Enter your name">

        <br><br>

        <button onclick="sendMessage()">Send</button>

        <p id="contactMessage"></p>

    </div>


    <footer>
        <p>Made with ❤️ by Me</p>
    </footer>


    <script>

        function showMessage() {
            document.getElementById("message").innerHTML =
            "Hello bro! Welcome to my website 🤩🔥";
        }


        function sendMessage() {

            let name = document.getElementById("name").value;

            document.getElementById("contactMessage").innerHTML =
            "Hello " + name + "! 👋 Thanks for visiting my website.";

        }

    </script>
<section id="contact">
    <h2>Contact Me 📩</h2>

    <p>Want to say hello? 👋</p>

    <form>
        <input type="text" placeholder="Your Name" required>

        <input type="email" placeholder="Your Email" required>

        <textarea placeholder="Your Message" rows="5" required></textarea>

        <button type="submit">Send Message 🚀</button>
    </form>
</section>
</body>

</html>
