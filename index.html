<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanish | Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f0f0f;
            color: white;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 span {
            color: #00e5ff;
        }

        p {
            color: #ccc;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #00e5ff;
            color: #000;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .about {
            padding: 60px 25px;
            background: #181818;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .skills {
            padding: 60px 25px;
        }

        .skill {
            display: inline-block;
            padding: 12px 20px;
            margin: 8px;
            border: 1px solid #444;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <section class="hero">
        <img src="myphoto.jpg" alt="Tanish">
        <h1>Hi, I'm <span>Tanish</span></h1>
        <p>Student • Future Web Developer 🚀</p>
        <a class="btn" href="#about">Explore My Portfolio</a>
    </section>

    <section class="about" id="about">
        <h2>About Me</h2>
        <p>
            I'm learning web development and building my skills
            step by step. This is my personal portfolio website.
        </p>
    </section>

    <section class="skills">
        <h2>My Skills</h2>
        <div class="skill">HTML</div>
        <div class="skill">CSS</div>
        <div class="skill">Java</div>
        <div class="skill">Web Development</div>
    </section>

</body>
</html>
